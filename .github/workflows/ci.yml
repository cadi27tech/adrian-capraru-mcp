name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: ASCII hyphen only
        run: |
          if LC_ALL=C grep -rnP '\xe2\x80[\x92-\x95]|\xe2\x88\x92' --exclude-dir=node_modules --exclude-dir=.git .; then exit 1; fi
      - name: Server answers over stdio from a clean install
        run: node examples/call.mjs how_to_hire | grep -q 'sends no messages'
